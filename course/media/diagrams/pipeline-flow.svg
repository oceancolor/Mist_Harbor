<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect width="940" height="470" fill="#f7f8ed"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" fill="#2d514b">asset_pipeline.py：一条命令，八步进游戏</text>

  <rect x="40" y="58" width="190" height="60" rx="8" fill="#497c6b"/>
  <text x="135" y="84" text-anchor="middle" font-size="13" fill="#ffffff">① tools/art/&lt;id&gt;.py</text>
  <text x="135" y="104" text-anchor="middle" font-size="12" fill="#dff0e6">≤256 KiB</text>

  <rect x="260" y="58" width="170" height="60" rx="8" fill="#497c6b"/>
  <text x="345" y="84" text-anchor="middle" font-size="13" fill="#ffffff">② task_id</text>
  <text x="345" y="104" text-anchor="middle" font-size="12" fill="#dff0e6">绑定脚本 sha8</text>

  <rect x="460" y="58" width="200" height="60" rx="8" fill="#497c6b"/>
  <text x="560" y="84" text-anchor="middle" font-size="13" fill="#ffffff">③ submit → observe</text>
  <text x="560" y="104" text-anchor="middle" font-size="12" fill="#dff0e6">异步：轮询到终端态</text>

  <rect x="690" y="58" width="210" height="60" rx="8" fill="#497c6b"/>
  <text x="795" y="84" text-anchor="middle" font-size="13" fill="#ffffff">④ GLB 下载</text>
  <text x="795" y="104" text-anchor="middle" font-size="12" fill="#dff0e6">sha256 校验 ← 必做</text>

  <line x1="230" y1="88" x2="258" y2="88" stroke="#789087" stroke-width="2" marker-end="url(#a)"/>
  <line x1="430" y1="88" x2="458" y2="88" stroke="#789087" stroke-width="2" marker-end="url(#a)"/>
  <line x1="660" y1="88" x2="688" y2="88" stroke="#789087" stroke-width="2" marker-end="url(#a)"/>
  <line x1="795" y1="118" x2="795" y2="152" stroke="#789087" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="155" width="190" height="60" rx="8" fill="#6d9e88"/>
  <text x="135" y="181" text-anchor="middle" font-size="13" fill="#ffffff">⑤ 预览 PNG</text>
  <text x="135" y="201" text-anchor="middle" font-size="12" fill="#eef7f0">art/previews/</text>

  <rect x="260" y="155" width="170" height="60" rx="8" fill="#6d9e88"/>
  <text x="345" y="181" text-anchor="middle" font-size="13" fill="#ffffff">⑥ 溯源</text>
  <text x="345" y="201" text-anchor="middle" font-size="12" fill="#eef7f0">provenance json</text>

  <rect x="460" y="155" width="200" height="60" rx="8" fill="#6d9e88"/>
  <text x="560" y="181" text-anchor="middle" font-size="13" fill="#ffffff">⑦ manifest.json</text>
  <text x="560" y="201" text-anchor="middle" font-size="12" fill="#eef7f0">bytes/tri/bounds</text>

  <rect x="690" y="155" width="210" height="60" rx="8" fill="#6d9e88"/>
  <text x="795" y="181" text-anchor="middle" font-size="13" fill="#ffffff">⑧ Godot 导入</text>
  <text x="795" y="201" text-anchor="middle" font-size="12" fill="#eef7f0">校验 .import 生成</text>

  <line x1="230" y1="185" x2="258" y2="185" stroke="#789087" stroke-width="2" marker-end="url(#a)"/>
  <line x1="430" y1="185" x2="458" y2="185" stroke="#789087" stroke-width="2" marker-end="url(#a)"/>
  <line x1="660" y1="185" x2="688" y2="185" stroke="#789087" stroke-width="2" marker-end="url(#a)"/>

  <rect x="260" y="250" width="420" height="70" rx="8" fill="#9dbda9"/>
  <text x="470" y="278" text-anchor="middle" font-size="14" fill="#ffffff">写 data/palette.json → 成为可放置建材</text>
  <text x="470" y="302" text-anchor="middle" font-size="12" fill="#f2f8f3">不传 --name/--color/--tip 就保留既有文案</text>

  <line x1="795" y1="215" x2="795" y2="245" stroke="#789087" stroke-width="2"/>
  <line x1="795" y1="245" x2="682" y2="245" stroke="#789087" stroke-width="2"/>
  <line x1="682" y1="245" x2="682" y2="248" stroke="#789087" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="345" width="410" height="100" rx="10" fill="#eef3ea" stroke="#b7cdb4"/>
  <text x="245" y="370" text-anchor="middle" font-size="13" fill="#2d514b">manifest.json 的三个消费者</text>
  <text x="56" y="394" font-size="12" fill="#789087">缩略图渲染 ← bounds.godot_size（自动构图）</text>
  <text x="56" y="412" font-size="12" fill="#789087">建材注册 ← godot_size[1] → 建议占位高度</text>
  <text x="56" y="430" font-size="12" fill="#789087">体积预算 ← bytes / triangles</text>

  <rect x="490" y="345" width="410" height="100" rx="10" fill="#eef3ea" stroke="#b7cdb4"/>
  <text x="695" y="370" text-anchor="middle" font-size="13" fill="#2d514b">测试自动跟上（回看卷 6 第 31 章）</text>
  <text x="506" y="394" font-size="12" fill="#789087">L1 建材数 ← 从 palette.json 推导</text>
  <text x="506" y="412" font-size="12" fill="#789087">L2 模型数 ← 从 palette.json 推导</text>
  <text x="506" y="430" font-size="12" fill="#789087">结果：加一件资产，改 0 行测试</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#789087"/>
    </marker>
  </defs>
</svg>
