<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect width="960" height="300" fill="#f7f8ed"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" fill="#2d514b">资产管线：一条命令，从脚本到可放置建材</text>

  <g>
    <rect x="20" y="90" width="130" height="70" rx="10" fill="#ffffff" stroke="#789087"/>
    <text x="85" y="118" text-anchor="middle" font-size="13" fill="#2d514b">tools/art/barrel.py</text>
    <text x="85" y="140" text-anchor="middle" font-size="11" fill="#789087">受版本控制的建模脚本</text>
    <text x="85" y="156" text-anchor="middle" font-size="11" fill="#497c6b">单文件 · 米制 Z-up</text>
  </g>

  <line x1="150" y1="125" x2="196" y2="125" stroke="#789087" stroke-width="2" marker-end="url(#a)"/>

  <g>
    <rect x="200" y="90" width="150" height="70" rx="10" fill="#ffffff" stroke="#789087"/>
    <text x="275" y="118" text-anchor="middle" font-size="13" fill="#2d514b">blender_submit</text>
    <text x="275" y="140" text-anchor="middle" font-size="11" fill="#789087">提交 → 轮询 observe</text>
    <text x="275" y="156" text-anchor="middle" font-size="11" fill="#497c6b">→ artifacts 取产物</text>
  </g>

  <line x1="350" y1="125" x2="396" y2="125" stroke="#789087" stroke-width="2"/>

  <g>
    <rect x="400" y="90" width="150" height="70" rx="10" fill="#eef3ea" stroke="#b7cdb4"/>
    <text x="475" y="118" text-anchor="middle" font-size="13" fill="#2d514b">GLB + 预览 + 回执</text>
    <text x="475" y="140" text-anchor="middle" font-size="11" fill="#789087">sha256 校验后落盘</text>
    <text x="475" y="156" text-anchor="middle" font-size="11" fill="#497c6b">assets/models/ + art/</text>
  </g>

  <line x1="550" y1="125" x2="596" y2="125" stroke="#789087" stroke-width="2"/>

  <g>
    <rect x="600" y="90" width="150" height="70" rx="10" fill="#eef3ea" stroke="#b7cdb4"/>
    <text x="675" y="118" text-anchor="middle" font-size="13" fill="#2d514b">manifest + Godot 导入</text>
    <text x="675" y="140" text-anchor="middle" font-size="11" fill="#789087">面数 / bounds / bytes</text>
    <text x="675" y="156" text-anchor="middle" font-size="11" fill="#497c6b">生成 .import</text>
  </g>

  <line x1="750" y1="125" x2="796" y2="125" stroke="#789087" stroke-width="2"/>

  <g>
    <rect x="800" y="90" width="140" height="70" rx="10" fill="#ffffff" stroke="#789087"/>
    <text x="870" y="118" text-anchor="middle" font-size="13" fill="#2d514b">data/palette.json</text>
    <text x="870" y="140" text-anchor="middle" font-size="11" fill="#789087">游戏里可选中的建材</text>
    <text x="870" y="156" text-anchor="middle" font-size="11" fill="#497c6b">保留原位 · 只覆盖传参</text>
  </g>

  <text x="480" y="215" text-anchor="middle" font-size="14" fill="#2d514b">python tools/asset_pipeline.py build --id barrel --name 木桶 --category 建筑</text>
  <text x="480" y="250" text-anchor="middle" font-size="12" fill="#789087">任务 id 绑定脚本摘要：改了脚本才会产生新任务；失败用 --retry，并自动拉取远端日志</text>
  <text x="480" y="276" text-anchor="middle" font-size="12" fill="#497c6b">新增建材零图标代码（运行时渲染 GLB 缩略图）</text>
</svg>
